name: Validate Bluetooth add-on source
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool repository.json >/dev/null
          python -m json.tool smart-jkbms-bluetooth/flows.json >/dev/null
          python -m py_compile smart-jkbms-bluetooth/ble/bridge.py
      - name: Validate YAML files
        run: |
          pip install 'PyYAML==6.0.2' 'bleak==3.0.2'
          python - <<'PY'
          import yaml
          from pathlib import Path
          paths = [Path('smart-jkbms-bluetooth/config.yaml'), *Path('smart-jkbms-bluetooth/translations').glob('*.yaml')]
          for path in paths:
              yaml.safe_load(path.read_text())
              print('OK', path)
          PY

      - name: BLE unit tests without hardware
        run: python -m unittest discover -s tests -v
      - name: Node-RED frame assembly checks
        run: node tests/test_frame_assembler.js
      - name: JK02 decoder checks
        run: node tests/test_jk_decoder.js
      - name: Quiet summary Debug checks
        run: node tests/test_quiet_summary.js
      - name: Per-BMS health debugging tests
        run: node tests/test_health_diagnostics.js
      - name: Compact per-BMS decoding diagnostics tests
        run: node tests/test_short_diagnostics.js
      - name: Raw temperature probe diagnostics checks
        run: node tests/test_raw_temperature.js
