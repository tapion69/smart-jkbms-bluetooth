name: Validate Bluetooth add-on source
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate JSON and Python syntax
        run: |
          python -m json.tool repository.json >/dev/null
          python -m json.tool smart-jkbms-bluetooth/flows.json >/dev/null
          python -m py_compile smart-jkbms-bluetooth/ble/bridge.py smart-jkbms-bluetooth/ble/mqtt_ha.py smart-jkbms-bluetooth/merge_flows.py
      - name: Validate YAML files
        run: |
          pip install 'PyYAML==6.0.2' 'bleak==3.0.2' 'paho-mqtt==2.1.0'
          python - <<'PY'
          import yaml
          from pathlib import Path
          paths = [Path('smart-jkbms-bluetooth/config.yaml'), *Path('smart-jkbms-bluetooth/translations').glob('*.yaml')]
          for path in paths:
              yaml.safe_load(path.read_text())
              print('OK', path)
          PY

      - name: BLE unit tests without hardware
        run: python -m unittest discover -s tests -v
      - name: Node-RED frame assembly checks
        run: node tests/test_frame_assembler.js
      - name: JK02 decoder checks
        run: node tests/test_jk_decoder.js
      - name: MQTT Home Assistant discovery tests
        run: python -m unittest discover -s tests -p 'test_mqtt_ha.py' -v
      - name: Config parameter safety and register tests
        run: python -m unittest discover -s tests -p 'test_parameters.py' -v
      - name: Node-RED to MQTT publisher tests
        run: node tests/test_mqtt_flows.js
