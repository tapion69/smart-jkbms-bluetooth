name: Smart JK-BMS Bluetooth (Development)
version: "0.3.0"
slug: smart_jkbms_ble
description: Experimental JK-BMS Bluetooth bridge and Node-RED diagnostics
startup: services
boot: auto
init: false
arch:
  - amd64
  - aarch64
host_dbus: true
host_network: false
ingress: false
ports:
  "1895/tcp": 1895
ports_description:
  "1895/tcp": Node-RED editor (LAN or VPN)
panel_icon: mdi:bluetooth
options:
  bluetooth_adapter: auto
  scan_interval_seconds: 45
  scan_duration_seconds: 8
  scan_all_devices: false
  bms_addresses: ""
  connection_probe_seconds: 15
  persistent_connections: true
  adapter_reset_on_start: false
  mqtt_enabled: true
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic_prefix: smart_jkbms_ble
  mqtt_discovery_prefix: homeassistant
  debug_mode: true
  send_bip: true
schema:
  bluetooth_adapter: list(auto|hci0|hci1|hci2|hci3)
  scan_interval_seconds: int(20,300)
  scan_duration_seconds: int(3,20)
  scan_all_devices: bool
  bms_addresses: str?
  connection_probe_seconds: int(5,60)
  persistent_connections: bool
  adapter_reset_on_start: bool
  mqtt_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic_prefix: str
  mqtt_discovery_prefix: str
  debug_mode: bool
  send_bip: bool
