configuration:
  ble_connection_mode:
    name: Mode de connexion Bluetooth
    description: local pour le Bluetooth du serveur, esphome_proxy pour un ESP32 Wi-Fi, hybrid pour les deux simultanément avec des MAC réparties.
  proxy_host:
    name: Adresse du proxy ESPHome
    description: Adresse IP ou nom local du proxy ESP32, sans port. Utilisée en mode esphome_proxy et hybrid.
  local_bms_addresses:
    name: Adresses BMS Bluetooth local (hybrid)
    description: Adresses MAC des BMS pris en charge par le Bluetooth du serveur, séparées par des virgules. Mode hybrid uniquement.
  proxy_bms_addresses:
    name: Adresses BMS proxy ESP32 (hybrid)
    description: Adresses MAC des BMS pris en charge par le proxy ESPHome, séparées par des virgules. Mode hybrid uniquement.
  proxy_noise_psk:
    name: Clé API chiffrée ESPHome
    description: Clé de chiffrement ESPHome (api.encryption.key). Laisser vide uniquement si l'API ESPHome du proxy n'est pas chiffrée.
  bluetooth_adapter:
    name: Adaptateur Bluetooth
    description: auto pour utiliser BlueZ automatiquement, ou hci0/hci1 pour choisir.
  scan_interval_seconds:
    name: Pause entre cycles BLE (secondes)
    description: Temps d'attente après recherche et essais de connexion.
  scan_duration_seconds:
    name: Durée de recherche BLE (secondes)
    description: Durée de chaque recherche des périphériques Bluetooth à proximité.
  scan_all_devices:
    name: Afficher tous les appareils BLE
    description: Afficher aussi les périphériques non identifiés comme JK-BMS.
  bms_addresses:
    name: Adresses Bluetooth JK-BMS
    description: Adresses MAC séparées par des virgules. Vider pour découvrir uniquement.
  connection_probe_seconds:
    name: Durée de connexion d'essai (secondes)
    description: Connexion Bluetooth en lecture seule, sans commande de lecture JK-BMS.
  persistent_connections:
    name: Connexions Bluetooth permanentes par BMS
    description: Chaque batterie reste connectée avec reconnexion indépendante. Désactiver pour revenir aux connexions courtes de la v0.1.7.
  allow_parameter_changes:
    name: Autorisation générale de modification
    description: Désactivé par défaut. La modification nécessite aussi un accord individuel sur chaque BMS dans Home Assistant.
  adapter_reset_on_start:
    name: Réinitialiser le Bluetooth au démarrage
    description: Désactivé par défaut. Coupe tous les appareils de cet adaptateur. Choisir explicitement hci0/hci1/hci2/hci3 (pas auto).
  send_bip:
    name: BIP - Compter les installations
    description: Activé par défaut. Permet de connaître le nombre d'installations en fonctionnement. Désactiver pour ne rien envoyer.
  debug_mode:
    name: Diagnostic détaillé
    description: Réservé aux tests initiaux.
