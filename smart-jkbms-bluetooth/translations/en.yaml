configuration:
  ble_connection_mode:
    name: Bluetooth connection mode
    description: local uses the Home Assistant host adapter; esphome_proxy uses a remote ESP32 over Wi-Fi.
  proxy_host:
    name: ESPHome proxy address
    description: LAN IPv4 or hostname of your ESP32 proxy, without the port. Only used in esphome_proxy mode.
  proxy_noise_psk:
    name: ESPHome encrypted API key
    description: ESPHome api.encryption.key. Leave blank only if the ESPHome API is not encrypted.
  bluetooth_adapter:
    name: Bluetooth adapter
    description: Auto selects a BlueZ adapter; choose hci0/hci1 to select manually.
  scan_interval_seconds:
    name: Pause between BLE cycles (seconds)
    description: Delay after scanning and all connection probes.
  scan_duration_seconds:
    name: Bluetooth scan duration (seconds)
    description: Duration of a nearby BLE device scan.
  scan_all_devices:
    name: Show all BLE devices
    description: Include unnamed and non-JK devices for troubleshooting.
  bms_addresses:
    name: JK-BMS Bluetooth addresses
    description: Comma-separated MAC addresses; leave empty for discovery only.
  connection_probe_seconds:
    name: Connection probe duration (seconds)
    description: Duration of legacy short probe sessions. The standard persistent mode retrieves settings and measurements automatically.
  persistent_connections:
    name: Persistent independent BMS Bluetooth connections
    description: Keep each battery connected and reconnect independently. Disable for legacy short connections.
  allow_parameter_changes:
    name: Allow BMS parameter changes (master safety)
    description: Off by default. Both this option and the per-BMS Home Assistant permission switch must be on to write settings; otherwise read-only monitoring continues.
  send_bip:
    name: BIP - Installation count
    description: Enabled by default to count active installations. Disable to stop reporting.
  adapter_reset_on_start:
    name: Reset Bluetooth controller on startup
    description: Off by default. Disconnects all devices using this controller. Select hci0/hci1/hci2/hci3 explicitly, not auto.
  debug_mode:
    name: Detailed diagnostics
    description: Reserved for initial troubleshooting.
